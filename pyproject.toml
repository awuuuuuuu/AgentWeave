[project]
name = "ragent"
version = "0.1.0"
description = "Enterprise-grade Agent+RAG system"
requires-python = ">=3.11"
dependencies = [
    # ── Step 1: 文档摄入 ──────────────────────────────────────────────────────
    "pymupdf>=1.24",                   # fitz：fast 策略文字提取 + 单页截取
    "unstructured>=0.15",              # API 客户端（hi_res 走远端，本地不跑 DL）
    "python-docx>=1.1",                # Word 文档解析
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "chardet>=5.0",
    "openpyxl>=3.1",                 # Excel (.xlsx) 解析
    "tiktoken",
    "openai>=2.31.0",
    "pymilvus>=2.5",
    "sentence-transformers>=5.4.1",
    "langgraph>=1.1.9",
    "langchain-core>=1.3.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.45.0",
    "python-multipart>=0.0.26",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "langchain-openai>=1.1.16",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "alembic>=1.13",
    "celery>=5.3",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",                     # FastAPI AsyncClient HTTP 层测试
    "ruff>=0.4",
    "python-dotenv>=1.0",              # conftest.py 加载 .env
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "integration: tests requiring Unstructured API or local hi_res environment",
]
